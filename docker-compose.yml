version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./results:/app/results
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - CONCURRENCY=5
      - TIMEOUT_MS=45000
      - RESULTS_DIR=/app/results
      - MAX_RETRIES=2
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data: